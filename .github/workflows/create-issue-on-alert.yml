name: Create issue on New Relic alert

on:
  repository_dispatch:
    types: [new-relic-alert]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload;
            const body = [
              `## Alert Summary`,
              ``,
              `The condition **${payload.condition_name}** fired on policy **${payload.policy_name}**.`,
              ``,
              `## Policy & Condition`,
              ``,
              `- **Policy:** ${payload.policy_name}`,
              `- **Condition:** ${payload.condition_name}`,
              ``,
              `## Severity & Timing`,
              ``,
              `- **Severity:** ${payload.severity}`,
              `- **Triggered at:** ${payload.timestamp}`,
              ``,
              `## Details`,
              ``,
              payload.details,
              ``,
              `## Triage Checklist`,
              ``,
              `- [ ] Acknowledge the alert`,
              `- [ ] Check service health in New Relic`,
              `- [ ] Identify root cause`,
              `- [ ] Apply fix or escalate`,
              `- [ ] Confirm alert has resolved`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Alert] ${payload.condition_name}`,
              body,
              labels: ['Mission: Triage Alert'],
            });
