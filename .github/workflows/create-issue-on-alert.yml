name: Create issue on New Relic alert

on:
  repository_dispatch:
    types: [new-relic-alert]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload.client_payload;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Alert] ${payload.condition_name}`,
              body: [
                `**Policy:** ${payload.policy_name}`,
                `**Severity:** ${payload.severity}`,
                `**Triggered at:** ${payload.timestamp}`,
                ``,
                `**Details:**`,
                payload.details,
              ].join('\n'),
              labels: ['alert', 'new-relic'],
            });
