services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  newrelic-infra:
    image: newrelic/infrastructure:latest
    cap_add:
      - SYS_PTRACE
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NRIA_DISPLAY_NAME: ${NEW_RELIC_DISPLAY_NAME:-agent-lab}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "3001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.agent-lab.localhost`)
      - traefik.http.services.api.loadbalancer.server.port=3001
    environment:
      NODE_ENV: production
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: agent-lab-api
      NEW_RELIC_LOG_LEVEL: ${NEW_RELIC_LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`web.agent-lab.localhost`)
      - traefik.http.services.web.loadbalancer.server.port=3000
    environment:
      NODE_ENV: production
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: agent-lab-web
      NEW_RELIC_LOG_LEVEL: ${NEW_RELIC_LOG_LEVEL:-info}
    depends_on:
      - api
    restart: unless-stopped
